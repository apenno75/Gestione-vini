<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Mia Cantina dei Vini</title>
    <!-- Tailwind CSS per una grafica moderna e pulita -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK di Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome per le icone delle stelline e del cuoricino -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-amber-50 text-stone-800 font-sans min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <div class="max-w-4xl w-full mx-auto bg-white shadow-xl rounded-2xl p-6 md:p-10 border border-amber-200 text-center">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-purple-700 tracking-wide"><i class="fa-solid fa-wine-glass-empty mr-2"></i>La Mia Cantina Personale</h1>
            <p class="text-stone-500 text-sm mt-1">Registra e gestisci i vini che ti sono piaciuti</p>
        </header>

        <!-- Pulsanti Principali per aprire i Modali -->
        <div class="flex flex-col sm:flex-row justify-center gap-4 my-6">
            <button onclick="apriModalCaricaNuovo()" class="bg-amber-700 text-white font-semibold px-6 py-3 rounded-lg shadow hover:bg-amber-800 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Carica Vini
            </button>
            <button onclick="apriModalLista()" class="bg-amber-800 text-white font-semibold px-6 py-3 rounded-lg shadow hover:bg-amber-900 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-list"></i> Lista Vini
            </button>
        </div>
    </div>

    <!-- Modale Carica Vini -->
    <div id="modalCarica" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-4xl w-full p-6 md:p-12 border border-amber-200 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="chiudiModalCarica()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700 text-2xl font-bold">&times;</button>
            
            <!-- Form di Inserimento -->
            <form id="wineForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-amber-50/50 p-6 rounded-xl border border-amber-100">
                <h2 id="formTitle" class="md:col-span-2 text-xl font-semibold text-amber-800 border-b pb-2 mb-2">Aggiungi Nuovo Vino</h2>

                <!-- Nome -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-stone-700">Nome del Vino *</label>
                    <input type="text" id="nome" required class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border focus:ring-amber-500 focus:border-amber-500">
                </div>

                <!-- Tipologia -->
                <div>
                    <label class="block text-sm font-medium text-stone-700">Tipologia *</label>
                    <select id="tipologia" onchange="aggiornaMovimento()" required class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border bg-white">
                        <option value="">Seleziona...</option>
                        <option value="Rosso">Rosso</option>
                        <option value="Bianco">Bianco</option>
                        <option value="Rosato">Rosato</option>
                        <option value="Spumante">Spumante</option>
                        <option value="Dolce/Passito">Dolce/Passito</option>
                    </select>
                </div>

                <!-- Fermo / Mosso -->
                <div>
                    <label class="block text-sm font-medium text-stone-700">Caratteristica *</label>
                    <select id="movimento" required class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border bg-white">
                        <option value="Fermo">Fermo</option>
                        <option value="Mosso">Mosso</option>
                    </select>
                </div>

                <!-- Classificazione -->
                <div>
                    <label class="block text-sm font-medium text-stone-700">Classificazione *</label>
                    <select id="classificazione" required class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border bg-white">
                        <option value="IGT">IGT</option>
                        <option value="IGP">IGP</option>
                        <option value="DOC">DOC</option>
                        <option value="DOP">DOP</option>
                        <option value="DOCG">DOCG</option>
                    </select>
                </div>

                <!-- Gradi Alcolici -->
                <div>
                    <label class="block text-sm font-medium text-stone-700">Gradi Alcolici (%)</label>
                    <input type="number" step="0.1" id="gradi_alcolici" placeholder="es. 13.5" class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border">
                </div>

                <!-- Costo e Quantità Bottiglia -->
                <div>
                    <label class="block text-sm font-medium text-stone-700">Costo Indicativo (€)</label>
                    <input type="number" step="0.01" id="costo" class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border">
                </div>

                <div>
                    <label class="block text-sm font-medium text-stone-700">Quantità Bottiglia</label>
                    <select id="quantita" class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border bg-white">
                        <option value="0.5l">0.5l</option>
                        <option value="0.75l" selected>0.75l</option>
                        <option value="1l">1l</option>
                        <option value="2l">2l</option>
                    </select>
                </div>

                <!-- Regione -->
                <div>
                    <label class="block text-sm font-medium text-stone-700">Regione</label>
                    <input type="text" id="regione" class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border">
                </div>

                <!-- Produttore -->
                <div>
                    <label class="block text-sm font-medium text-stone-700">Produttore</label>
                    <input type="text" id="produttore" class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border">
                </div>

                <!-- Cantina -->
                <div>
                    <label class="block text-sm font-medium text-stone-700">Cantina</label>
                    <input type="text" id="cantina" class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border">
                </div>

                <!-- Annata -->
                <div>
                    <label class="block text-sm font-medium text-stone-700">Annata</label>
                    <input type="number" id="annata" placeholder="es. 2020" class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border">
                </div>

                <!-- Rating Stelline e Cuoricino Preferito -->
                <div class="md:col-span-2 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <label class="block text-sm font-medium text-stone-700 mb-1">Rating (da 1 a 5 stelline)</label>
                        <div id="starRating" class="flex space-x-2 text-3xl cursor-pointer">
                            <i class="fa-solid fa-star text-amber-500" data-value="1"></i>
                            <i class="fa-solid fa-star text-amber-500" data-value="2"></i>
                            <i class="fa-solid fa-star text-amber-500" data-value="3"></i>
                            <i class="fa-solid fa-star text-amber-500" data-value="4"></i>
                            <i class="fa-solid fa-star text-amber-500" data-value="5"></i>
                        </div>
                        <input type="hidden" id="ratingValue" value="5">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-stone-700 mb-1">Preferito</label>
                        <div id="heartRating" class="text-3xl cursor-pointer inline-block">
                            <i class="fa-solid fa-heart text-stone-300" data-liked="false"></i>
                        </div>
                        <input type="hidden" id="preferitoValue" value="false">
                    </div>
                </div>

                <!-- Foto Fronte -->
                <div>
                    <label class="block text-sm font-medium text-stone-700">Foto Fronte <span class="text-xs text-stone-400">(Opzionale)</span></label>
                    <input type="file" id="fotoFronte" accept="image/*" capture="environment" class="mt-1 block w-full text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200">
                </div>

                <!-- Foto Retro -->
                <div>
                    <label class="block text-sm font-medium text-stone-700">Foto Retro <span class="text-xs text-stone-400">(Opzionale)</span></label>
                    <input type="file" id="fotoRetro" accept="image/*" capture="environment" class="mt-1 block w-full text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200">
                </div>

                <!-- Sezione Analisi Sensoriale -->
                <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 border-t pt-4 mt-2">
                    <h3 class="md:col-span-2 text-lg font-semibold text-amber-800">Analisi Sensoriale</h3>
                    
                    <div>
                        <label class="block text-sm font-medium text-stone-700">Colore</label>
                        <input type="text" id="note_colore" placeholder="es. Rosso rubino carico" class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-stone-700">Olfatto</label>
                        <input type="text" id="note_olfatto" placeholder="es. Sentori di frutti di bosco e spezie" class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-stone-700">Gusto</label>
                        <input type="text" id="note_gusto" placeholder="es. Caldo, strutturato, persistente" class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-stone-700">Abbinamenti</label>
                        <input type="text" id="note_abbinamenti" placeholder="es. Carni rosse, selvaggina, formaggi stagionati" class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border">
                    </div>
                </div>

                <!-- Note Generali Finali -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-stone-700">Note Generali</label>
                    <textarea id="note" rows="3" placeholder="Altre considerazioni personali..." class="mt-1 block w-full rounded-md border-stone-300 shadow-sm p-2 border"></textarea>
                </div>

                <!-- Pulsante Salvataggio -->
                <div class="md:col-span-2 text-center mt-4">
                    <button type="submit" id="submitBtn" class="bg-amber-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow hover:bg-amber-800 transition">Salva nella Cantina</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modale Lista Vini -->
    <div id="modalLista" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-4xl w-full p-6 md:p-10 border border-amber-200 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="chiudiModalLista()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700 text-2xl font-bold">&times;</button>
            
            <!-- Lista Vini Salvati -->
            <section>
                <h2 class="text-2xl font-bold text-amber-900 mb-4 border-b pb-2">I Miei Vini Salvati</h2>
                
                <!-- Barra di Ricerca -->
                <div class="mb-6 flex gap-2">
                    <input type="text" id="searchInput" placeholder="Cerca per Nome o Tipologia..." oninput="applicaFiltro()" class="flex-grow rounded-md border-stone-300 shadow-sm p-2 border focus:ring-amber-500 focus:border-amber-500">
                </div>

                <div id="viniList" class="grid grid-cols-1 gap-6">
                    <!-- Vini caricati dinamicamente via JS -->
                </div>

                <!-- Controlli di Paginazione -->
                <div id="paginationContainer" class="flex justify-between items-center mt-6 pt-4 border-t">
                    <button id="prevBtn" onclick="cambiaPagina(-1)" class="bg-amber-700 text-white px-4 py-2 rounded-lg text-sm disabled:opacity-50 disabled:cursor-not-allowed hover:bg-amber-800 transition">Precedente</button>
                    <span id="pageInfo" class="text-sm text-stone-600 font-medium">Pagina 1 di 1</span>
                    <button id="nextBtn" onclick="cambiaPagina(1)" class="bg-amber-700 text-white px-4 py-2 rounded-lg text-sm disabled:opacity-50 disabled:cursor-not-allowed hover:bg-amber-800 transition">Successiva</button>
                </div>
            </section>
        </div>
    </div>

    <!-- Modale per ingrandire l'immagine a tutto schermo -->
    <div id="imageModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 cursor-pointer" onclick="chiudiModal()">
        <img id="modalImg" class="max-h-full max-w-full rounded shadow-2xl object-contain">
    </div>

    <script>
        // --- CONFIGURAZIONE SUPABASE ---
        const SUPABASE_URL = 'https://erukzvrtjnvyzjvfuirn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_FDhQ03affjzeyhCHuoKulg_Rp7PdyLM';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- VARIABILI GLOBALI PER PAGINAZIONE, FILTRO E MODIFICA ---
        let tuttiIVini = [];
        let viniFiltrati = [];
        let paginaCorrente = 1;
        const elementiPerPagina = 5;
        let vinoInModificaId = null;

        // --- GESTIONE MODALI APERTURA/CHIUSURA ---
        function apriModalCaricaNuovo() {
            resetForm();
            apriModalCarica();
        }
        function apriModalCarica() {
            document.getElementById('modalCarica').classList.remove('hidden');
        }
        function chiudiModalCarica() {
            document.getElementById('modalCarica').classList.add('hidden');
            resetForm();
        }
        function apriModalLista() {
            document.getElementById('modalLista').classList.remove('hidden');
            caricaVini();
        }
        function chiudiModalLista() {
            document.getElementById('modalLista').classList.add('hidden');
        }

        function resetForm() {
            vinoInModificaId = null;
            document.getElementById('wineForm').reset();
            const formTitle = document.getElementById('formTitle');
            if(formTitle) formTitle.textContent = 'Aggiungi Nuovo Vino';
            document.getElementById('submitBtn').textContent = 'Salva nella Cantina';
            
            document.getElementById('ratingValue').value = 5;
            stars.forEach(s => {
                s.classList.remove('text-stone-300');
                s.classList.add('text-amber-500');
            });
            document.getElementById('preferitoValue').value = 'false';
            heartIcon.setAttribute('data-liked', 'false');
            heartIcon.classList.remove('text-red-500');
            heartIcon.classList.add('text-stone-300');
        }

        // --- GESTIONE CORRETTA DELLE STELLINE ---
        const stars = document.querySelectorAll('#starRating i');
        stars.forEach((star) => {
            star.addEventListener('click', (e) => {
                const val = parseInt(e.target.getAttribute('data-value'));
                document.getElementById('ratingValue').value = val;
                
                stars.forEach((s) => {
                    const sVal = parseInt(s.getAttribute('data-value'));
                    if (sVal <= val) {
                        s.classList.remove('text-stone-300');
                        s.classList.add('text-amber-500');
                    } else {
                        s.classList.remove('text-amber-500');
                        s.classList.add('text-stone-300');
                    }
                });
            });
        });

        // --- GESTIONE DEL CUORICINO PREFERITO ---
        const heartIcon = document.querySelector('#heartRating i');
        heartIcon.addEventListener('click', () => {
            const isLiked = heartIcon.getAttribute('data-liked') === 'true';
            if (isLiked) {
                heartIcon.setAttribute('data-liked', 'false');
                heartIcon.classList.remove('text-red-500');
                heartIcon.classList.add('text-stone-300');
                document.getElementById('preferitoValue').value = 'false';
            } else {
                heartIcon.setAttribute('data-liked', 'true');
                heartIcon.classList.remove('text-stone-300');
                heartIcon.classList.add('text-red-500');
                document.getElementById('preferitoValue').value = 'true';
            }
        });

        function aggiornaMovimento() {
            const tipologia = document.getElementById('tipologia').value;
            const movimento = document.getElementById('movimento');
            if (tipologia === 'Spumante') {
                movimento.value = 'Mosso';
            }
        }

        // --- FUNZIONE DI RIDIMENSIONAMENTO AUTOMATICO (Max ~900KB) ---
        async function ridimensionaSeNecessario(file) {
            if (!file) return null;
            if (file.size <= 900 * 1024) return file;

            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        const maxDim = 1600;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        let quality = 0.85;
                        function provaCompress() {
                            canvas.toBlob((blob) => {
                                if (blob.size <= 900 * 1024 || quality <= 0.3) {
                                    const compressedFile = new File([blob], file.name, {
                                        type: 'image/jpeg',
                                        lastModified: Date.now()
                                    });
                                    resolve(compressedFile);
                                } else {
                                    quality -= 0.15;
                                    provaCompress();
                                }
                            }, 'image/jpeg', quality);
                        }
                        provaCompress();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function caricaFoto(file, pathPrefix) {
            if (!file) return null;
            const fileProcessato = await ridimensionaSeNecessario(file);

            const fileName = `${pathPrefix}_${Date.now()}_${fileProcessato.name}`;
            const { data, error } = await _supabase.storage
                .from('vini-foto')
                .upload(fileName, fileProcessato);

            if (error) throw error;

            const { data: publicUrlData } = _supabase.storage
                .from('vini-foto')
                .getPublicUrl(fileName);

            return publicUrlData.publicUrl;
        }

        // --- INVIO FORM E SALVATAGGIO / MODIFICA ---
        document.getElementById('wineForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Letti IMMEDIATAMENTE tutti i valori dal DOM per evitare azzeramenti asincroni
            const nomeVal = document.getElementById('nome').value;
            const tipologiaVal = document.getElementById('tipologia').value;
            const movimentoVal = document.getElementById('movimento').value;
            const classificazioneVal = document.getElementById('classificazione').value;
            const gradiAlcoliciVal = parseFloat(document.getElementById('gradi_alcolici').value) || null;
            const costoVal = parseFloat(document.getElementById('costo').value) || 0;
            const quantitaVal = document.getElementById('quantita').value;
            const regioneVal = document.getElementById('regione').value;
            const produttoreVal = document.getElementById('produttore').value;
            const cantinaVal = document.getElementById('cantina').value;
            const annataVal = parseInt(document.getElementById('annata').value) || null;
            const ratingVal = parseInt(document.getElementById('ratingValue').value);
            const preferitoVal = document.getElementById('preferitoValue').value === 'true';
            const noteColoreVal = document.getElementById('note_colore').value;
            const noteOlfattoVal = document.getElementById('note_olfatto').value;
            const noteGustoVal = document.getElementById('note_gusto').value;
            const noteAbbinamentiVal = document.getElementById('note_abbinamenti').value;
            const noteVal = (document.getElementById('note')?.value || '').trim();

            const submitBtn = document.getElementById('submitBtn');
            const isEditing = !!vinoInModificaId;
            submitBtn.textContent = 'Salvataggio in corso...';
            submitBtn.disabled = true;

            try {
                const fileFronteInput = document.getElementById('fotoFronte').files[0];
                const fileRetroInput = document.getElementById('fotoRetro').files[0];

                let urlFronte = null;
                let urlRetro = null;

                if (isEditing) {
                    const vinoEsistente = tuttiIVini.find(v => v.id === vinoInModificaId || v.id == vinoInModificaId);
                    urlFronte = vinoEsistente ? vinoEsistente.foto_fronte : null;
                    urlRetro = vinoEsistente ? vinoEsistente.foto_retro : null;
                }

                if (fileFronteInput) {
                    urlFronte = await caricaFoto(fileFronteInput, 'fronte');
                }
                if (fileRetroInput) {
                    urlRetro = await caricaFoto(fileRetroInput, 'retro');
                }

                const datiVino = {
                    nome: nomeVal,
                    tipologia: tipologiaVal,
                    movimento: movimentoVal,
                    classificazione: classificazioneVal,
                    gradi_alcolici: gradiAlcoliciVal,
                    costo: costoVal,
                    quantita: quantitaVal,
                    regione: regioneVal,
                    produttore: produttoreVal,
                    cantina: cantinaVal,
                    annata: annataVal,
                    rating: ratingVal,
                    preferito: preferitoVal,
                    note_colore: noteColoreVal,
                    note_olfatto: noteOlfattoVal,
                    note_gusto: noteGustoVal,
                    note_abbinamenti: noteAbbinamentiVal,
                    note: noteVal,
                    foto_fronte: urlFronte,
                    foto_retro: urlRetro
                };

                console.log('Dati inviati a Supabase:', datiVino);

                if (isEditing) {
                    const { error } = await _supabase.from('vini').update(datiVino).eq('id', vinoInModificaId);
                    if (error) throw error;
                    alert('Vino aggiornato con successo!');
                } else {
                    const { error } = await _supabase.from('vini').insert([datiVino]);
                    if (error) throw error;
                    alert('Vino salvato con successo!');
                }

                chiudiModalCarica();
                caricaVini();
            } catch (err) {
                alert('Errore durante il salvataggio: ' + err.message);
            } finally {
                submitBtn.textContent = isEditing ? 'Aggiorna Vino' : 'Salva nella Cantina';
                submitBtn.disabled = false;
            }
        });

        // --- VISUALIZZAZIONE VINI CON PAGINAZIONE E RICERCA ---
        async function caricaVini() {
            const { data: vini, error } = await _supabase
                .from('vini')
                .select('*')
                .order('created_at', { ascending: false });

            if (error || !vini) {
                tuttiIVini = [];
            } else {
                tuttiIVini = vini;
            }
            applicaFiltro();
        }

        function applicaFiltro() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            viniFiltrati = tuttiIVini.filter(vino => {
                const nomeMatch = vino.nome && vino.nome.toLowerCase().includes(query);
                const tipologiaMatch = vino.tipologia && vino.tipologia.toLowerCase().includes(query);
                return nomeMatch || tipologiaMatch;
            });
            paginaCorrente = 1;
            mostraPagina();
        }

        function mostraPagina() {
            const container = document.getElementById('viniList');
            container.innerHTML = '';

            if (viniFiltrati.length === 0) {
                container.innerHTML = '<p class="text-stone-500 text-center">Nessun vino registrato al momento.</p>';
                document.getElementById('pageInfo').textContent = 'Pagina 0 di 0';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }

            const totalePagine = Math.ceil(viniFiltrati.length / elementiPerPagina);
            if (paginaCorrente > totalePagine) paginaCorrente = totalePagine;
            if (paginaCorrente < 1) paginaCorrente = 1;

            const start = (paginaCorrente - 1) * elementiPerPagina;
            const end = start + elementiPerPagina;
            const viniPagina = viniFiltrati.slice(start, end);

            viniPagina.forEach(vino => {
                let stelleHtml = '';
                for(let i=1; i<=5; i++) {
                    stelleHtml += `<i class="fa-solid fa-star ${i <= vino.rating ? 'text-amber-500' : 'text-stone-300'}"></i>`;
                }

                let cuoricinoHtml = `<i class="fa-solid fa-heart ${vino.preferito ? 'text-red-500' : 'text-stone-300'} ml-2" title="${vino.preferito ? 'Preferito' : 'Non preferito'}"></i>`;

                let immaginiHtml = '';
                if (vino.foto_fronte || vino.foto_retro) {
                    immaginiHtml = `<div class="flex space-x-2 shrink-0">`;
                    if (vino.foto_fronte) {
                        immaginiHtml += `<img src="${vino.foto_fronte}" alt="Fronte" class="w-24 h-32 object-cover rounded border cursor-pointer hover:opacity-90 transition" onclick="apriModal('${vino.foto_fronte}')" title="Clicca per ingrandire">`;
                    }
                    if (vino.foto_retro) {
                        immaginiHtml += `<img src="${vino.foto_retro}" alt="Retro" class="w-24 h-32 object-cover rounded border cursor-pointer hover:opacity-90 transition" onclick="apriModal('${vino.foto_retro}')" title="Clicca per ingrandire">`;
                    }
                    immaginiHtml += `</div>`;
                } else {
                    immaginiHtml = `<div class="w-24 h-32 flex items-center justify-center bg-stone-100 border border-dashed border-stone-300 rounded text-stone-400 text-xs text-center shrink-0 p-1">Nessuna foto</div>`;
                }

                const testoNoteGenerali = vino.note || '';
                const haNote = vino.note_colore || vino.note_olfatto || vino.note_gusto || vino.note_abbinamenti || testoNoteGenerali;

                let blockNote = '';
                if (haNote) {
                    blockNote = `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 text-xs text-stone-600 mt-2 bg-stone-50 p-2 rounded">
                            ${vino.note_colore ? `<div><span class="font-semibold">Colore:</span> ${vino.note_colore}</div>` : ''}
                            ${vino.note_olfatto ? `<div><span class="font-semibold">Olfatto:</span> ${vino.note_olfatto}</div>` : ''}
                            ${vino.note_gusto ? `<div><span class="font-semibold">Gusto:</span> ${vino.note_gusto}</div>` : ''}
                            ${vino.note_abbinamenti ? `<div><span class="font-semibold">Abbinamenti:</span> ${vino.note_abbinamenti}</div>` : ''}
                            ${testoNoteGenerali ? `<div class="sm:col-span-2"><span class="font-semibold">Note Generali:</span> ${testoNoteGenerali}</div>` : ''}
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = 'bg-white border border-amber-200 rounded-xl p-5 shadow-sm flex flex-col md:flex-row gap-4 items-center';
                
                card.innerHTML = `
                    ${immaginiHtml}
                    <div class="flex-grow space-y-1 text-center md:text-left w-full">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                            <div class="flex items-center justify-center md:justify-start gap-2">
                                <h3 class="text-xl font-bold text-amber-900">${vino.nome}</h3>
                                <span class="text-xs font-semibold px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full">${vino.classificazione}</span>
								${vino.gradi_alcolici ? `<span class="font-small">Alcol:</span> ${vino.gradi_alcolici}%` : ''}
                            </div>
                            <div class="flex items-center justify-center md:justify-end gap-2">
                                <button onclick="popolaEApriModifica('${vino.id}')" class="bg-amber-600 text-white text-xs font-medium px-3 py-1.5 rounded shadow hover:bg-amber-700 transition flex items-center gap-1">
                                    <i class="fa-solid fa-pen"></i> Modifica
                                </button>
                                <button onclick="eliminaVino('${vino.id}')" class="bg-red-600 text-white text-xs font-medium px-3 py-1.5 rounded shadow hover:bg-red-700 transition flex items-center gap-1">
                                    <i class="fa-solid fa-trash"></i> Cancella
                                </button>
                            </div>
                        </div>
                        <p class="text-sm text-stone-600"><span class="font-medium">Tipologia:</span> ${vino.tipologia} (${vino.movimento}) </p>
                        <p class="text-sm text-stone-600"><span class="font-medium">Cantina / Produttore:</span> ${vino.cantina || 'N.D.'} / ${vino.produttore || 'N.D.'} ${vino.annata ? `<BR> <span class="font-medium">Annata:</span> ${vino.annata}` : ''}</p>
                        <p class="text-sm text-stone-600"><span class="font-medium">Regione:</span> ${vino.regione || 'N.D.'} | <span class="font-medium">Formato:</span> ${vino.quantita || '0.75l'} <BR> <span class="font-medium">Costo:</span> €${vino.costo ? vino.costo.toFixed(2) : '0.00'}</p>
                        
                        <div class="flex items-center justify-center md:justify-start space-x-1 pt-1">
                            <span class="text-xs text-stone-500 italic mt-1">Valutazione: ${stelleHtml}</span>
                            <span class="text-xs text-stone-500 italic mt-1">Preferiti:${cuoricinoHtml}</span>
                        </div>

                        ${blockNote}
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('pageInfo').textContent = `Pagina ${paginaCorrente} di ${totalePagine}`;
            document.getElementById('prevBtn').disabled = paginaCorrente === 1;
            document.getElementById('nextBtn').disabled = paginaCorrente === totalePagine;
        }

        function cambiaPagina(direzione) {
            paginaCorrente += direzione;
            mostraPagina();
        }

        // --- FUNZIONI PER MODIFICA ED ELIMINAZIONE VINO ---
        function popolaEApriModifica(id) {
            const vino = tuttiIVini.find(v => v.id === id || v.id == id);
            if (!vino) return;

            resetForm();
            vinoInModificaId = vino.id;

            document.getElementById('nome').value = vino.nome || '';
            document.getElementById('tipologia').value = vino.tipologia || '';
            document.getElementById('movimento').value = vino.movimento || '';
            document.getElementById('classificazione').value = vino.classificazione || '';
            document.getElementById('gradi_alcolici').value = (vino.gradi_alcolici !== null && vino.gradi_alcolici !== undefined) ? vino.gradi_alcolici : '';
            document.getElementById('costo').value = (vino.costo !== null && vino.costo !== undefined) ? vino.costo : '';
            document.getElementById('quantita').value = vino.quantita || '0.75l';
            document.getElementById('regione').value = vino.regione || '';
            document.getElementById('produttore').value = vino.produttore || '';
            document.getElementById('cantina').value = vino.cantina || '';
            document.getElementById('annata').value = vino.annata || '';

            const rating = vino.rating || 5;
            document.getElementById('ratingValue').value = rating;
            stars.forEach(s => {
                const sVal = parseInt(s.getAttribute('data-value'));
                if (sVal <= rating) {
                    s.classList.remove('text-stone-300');
                    s.classList.add('text-amber-500');
                } else {
                    s.classList.remove('text-amber-500');
                    s.classList.add('text-stone-300');
                }
            });

            const isLiked = !!vino.preferito;
            document.getElementById('preferitoValue').value = isLiked ? 'true' : 'false';
            heartIcon.setAttribute('data-liked', isLiked ? 'true' : 'false');
            if (isLiked) {
                heartIcon.classList.remove('text-stone-300');
                heartIcon.classList.add('text-red-500');
            } else {
                heartIcon.classList.remove('text-red-500');
                heartIcon.classList.add('text-stone-300');
            }

            document.getElementById('note_colore').value = vino.note_colore || '';
            document.getElementById('note_olfatto').value = vino.note_olfatto || '';
            document.getElementById('note_gusto').value = vino.note_gusto || '';
            document.getElementById('note_abbinamenti').value = vino.note_abbinamenti || '';
            document.getElementById('note').value = vino.note || '';

            const formTitle = document.getElementById('formTitle');
            if(formTitle) formTitle.textContent = 'Modifica Vino';
            document.getElementById('submitBtn').textContent = 'Aggiorna Vino';

            chiudiModalLista();
            apriModalCarica();
        }

        async function eliminaVino(id) {
            if (confirm('Sei sicuro di voler eliminare questo vino?')) {
                try {
                    const { error } = await _supabase.from('vini').delete().eq('id', id);
                    if (error) throw error;
                    alert('Vino eliminato con successo!');
                    caricaVini();
                } catch (err) {
                    alert('Errore durante l\'eliminazione: ' + err.message);
                }
            }
        }

        function apriModal(url) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = url;
            modal.classList.remove('hidden');
        }

        function chiudiModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }
    </script>
</body>
